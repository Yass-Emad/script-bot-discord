name: CyberControl CI Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-mock rich discord.py requests questionary

    - name: Syntax compile check
      run: |
        python -m py_compile cyber_bot_app.py
        echo "✓ Syntax compile check passed"

    - name: Run PyTest Test Suite
      run: |
        pytest tests/test_cybercontrol.py -v --tb=short
